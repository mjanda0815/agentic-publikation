# CI für das Whitepaper „Agentic Software Development" (übernommen aus dem
# DeFi-Publikationsprojekt, an dieses Repo angepasst).
#
# Push-Trigger ist aktiv. Er war am 06.08.2026 vorübergehend abgeschaltet,
# weil das Actions-Kontingent des damals noch privaten Repositories
# aufgebraucht war und Läufe ohne einen einzigen ausgeführten Schritt
# abbrachen. Seit das Repository öffentlich ist, sind Actions-Minuten
# kostenlos.
#
# Bis dahin ersetzt ein lokaler Klontest die eigentliche Leistung dieser
# Pipeline — den Nachweis, dass das Dokument aus einem frischen Checkout baut,
# also ohne nicht eingecheckte lokale Dateien:
#
#   git clone --depth 1 file:///pfad/zum/repo /tmp/klontest
#   make -C /tmp/klontest pdf fabrik karussell
#
# Zuletzt so verifiziert am 06.08.2026: Whitepaper 157 Seiten, Sonderdruck
# 33 Seiten, zwei Karussells zu je 10 Folien, keine LaTeX-Fehler, keine
# ungelösten Zitate, alle 30 Abbildungen eingecheckt.
name: Build PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kapitel/**"
      - "abbildungen/**"
      - "*.tex"
      - "literatur.bib"
      - "Makefile"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Make, Python/matplotlib und Pandoc (gepinnt auf 2.19.2)
        run: |
          apt-get update
          apt-get install -y make python3 python3-matplotlib fonts-lmodern wget
          wget -q https://github.com/jgm/pandoc/releases/download/2.19.2/pandoc-2.19.2-1-amd64.deb
          dpkg -i pandoc-2.19.2-1-amd64.deb
          pandoc --version | head -1

      - name: Abbildungen aus eingecheckten Daten erzeugen
        run: |
          echo "TODO: abbildungen/<skript>.py eintragen, sobald vorhanden"

      - name: Whitepaper bauen
        run: make pdf

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdf
          path: build/main.pdf
